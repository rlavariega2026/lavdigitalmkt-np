name: Deploy LAV Digital MKT landing page to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lav-digital-mkt-np
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish landing page to isolated lavdigitalmkt-np directory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy landing page to Hostinger lavdigitalmkt-np directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: ./lavdigitalmkt-np/
          exclude: |
            .git/**
            .git*
            **/.git/**
            **/.git*
            .github/**
            **/.github/**
            README.md
            **/README.md
            LEEME.txt
            **/LEEME.txt
